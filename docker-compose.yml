
services:
  fisq_app:
    build: .
    container_name: fisq_app
    restart: unless-stopped
    ports:
      - "8050:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=fisq_db
      - DB_PORT=3306
      - DB_DATABASE=fisq_production
      - DB_USERNAME=fisq_user
      - DB_PASSWORD=reiayanami! # <-- Contraseña de la app
    volumes:
      # 1. Tu archivo de configuración (Para cambiar cosas sin recompilar)
      - ./.env:/var/www/html/.env
      
      # 2. Persistencia de las fotos de las actas (¡CRÍTICO!)
      - ./storage/app/public:/var/www/html/storage/app/public
      
      # 3. Persistencia de los logs del sistema (laravel.log)
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      - fisq_db

  fisq_db:
    image: mysql:8.0
    container_name: fisq_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fisq_production
      MYSQL_USER: fisq_user
      MYSQL_PASSWORD: reiayanami! # <-- ¡AHORA SÍ COINCIDE!
      MYSQL_ROOT_PASSWORD: reiayanami # <-- Cambiá esto por otra clave fuerte
    volumes:
      # 4. Persistencia de la Base de Datos
      - fisq_mysql_data:/var/lib/mysql

volumes:
  fisq_mysql_data: